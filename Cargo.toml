[package]
name = "geotz-api"
version = "0.1.0"
edition = "2024"
authors = ["Neil Gardner"]
license = "MIT OR Apache-2.0"
description = "Place and time-zone lookup service backed by SQLite, with importers for GeoNames and TimeZoneDB data"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dotenvy = "0.15.7"
fs4 = "1.1.0"
futures-util = "0.3.34"
httpdate = "1.0.3"
julian_day_converter = "0.4.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "signal"] }
unicode-normalization = "0.1.26"
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
