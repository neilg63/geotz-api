# Languages that supply search names for places.
#
# A place's alternate names from GeoNames are kept only when they are in:
#   1. an official language of its country (taken from GeoNames countryInfo.txt)
#   2. a regional language listed below for its country
#   3. English
#   4. one of the "major" languages below
# and written in Latin script. Earlier tiers weigh more in search ranking.
#
# Codes are the ISO 639 codes GeoNames uses (two letters, or three where no
# two-letter code exists). Pass your own copy with --languages FILE.

# Tier 4: accepted for every place.
major = fr es it pt de nl

# Tier 2: regional and minority languages, per country code.
regional.DE = bar nds hsb dsb frr
regional.AT = bar
regional.CH = gsw
regional.IT = vec nap scn lmo pms fur lij lld
regional.FR = br oc co ca eu gsw
regional.ES = ca gl eu ast an oc
regional.GB = cy gd sco kw
regional.IE = ga
regional.NL = fy li
regional.BE = wa
regional.PL = csb szl
